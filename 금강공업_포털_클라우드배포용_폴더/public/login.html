<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 금강공업 시험성적의뢰 포털</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d4ed8">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
    
    <!-- Top Brand Header -->
    <div class="bg-gradient-to-r from-blue-900 to-indigo-900 p-8 text-white text-center">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-white/10 backdrop-blur-sm border border-white/20 flex items-center justify-center font-black text-2xl shadow-inner mb-3">
        K
      </div>
      <h1 class="text-xl font-bold tracking-tight">금강공업 시험성적의뢰 포털</h1>
      <p class="text-xs text-blue-200 mt-1">온라인 성적서 신청 및 실시간 진행현황 추적 시스템</p>
    </div>

    <!-- Login Form Area -->
    <div class="p-8 space-y-5">
      
      <!-- Account Type Tabs -->
      <div class="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-bold">
        <button id="tab-client" onclick="switchLoginType('client')" class="py-2.5 rounded-lg bg-white text-blue-700 shadow-sm transition">
          🏢 거래처 로그인
        </button>
        <button id="tab-admin" onclick="switchLoginType('admin')" class="py-2.5 rounded-lg text-slate-500 hover:text-slate-800 transition">
          🛡️ 사내 임직원 로그인
        </button>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1" id="login-id-label">거래처 코드 (또는 아이디)</label>
          <div class="relative">
            <input type="text" id="login-id" required placeholder="예: KC-10294" class="w-full text-sm px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
            <span class="absolute right-3 top-2.5 text-slate-400">
              <i data-lucide="user" class="w-4 h-4"></i>
            </span>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">비밀번호</label>
          <div class="relative">
            <input type="password" id="login-pw" required placeholder="비밀번호 입력" class="w-full text-sm px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
            <span class="absolute right-3 top-2.5 text-slate-400">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </span>
          </div>
        </div>

        <div id="login-error" class="hidden p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium leading-relaxed"></div>

        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold shadow-md hover:shadow-lg transition">
          로그인
        </button>
      </form>

      <!-- Client Register Trigger -->
      <div class="pt-2 text-center">
        <button onclick="openRegisterModal()" class="text-xs text-blue-600 hover:text-blue-800 font-semibold inline-flex items-center space-x-1">
          <i data-lucide="user-plus" class="w-3.5 h-3.5"></i>
          <span>아직 계정이 없으신가요? <strong>거래처 회원가입 신청</strong></span>
        </button>
      </div>

      <!-- Quick Test Accounts Helper -->
      <div class="pt-4 border-t border-slate-100">
        <div class="text-[11px] font-bold text-slate-400 mb-2">⚡ 빠른 테스트 로그인:</div>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <button onclick="quickFill('KC-10294', '1234', 'client')" class="p-2 rounded-lg bg-slate-50 hover:bg-slate-100 border border-slate-200 text-left transition">
            <div class="font-bold text-slate-800">서울철강(주)</div>
            <div class="text-[10px] text-slate-400">최인규 대리 (거래처)</div>
          </button>
          <button onclick="quickFill('admin', 'admin123', 'admin')" class="p-2 rounded-lg bg-blue-50/50 hover:bg-blue-100/50 border border-blue-200 text-left transition">
            <div class="font-bold text-blue-900">품질관리팀</div>
            <div class="text-[10px] text-blue-600">하지현 팀장 (승인권자)</div>
          </button>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="p-4 bg-slate-50 border-t border-slate-100 text-center text-xs text-slate-400">
      금강공업(주) 품질보증부 시스템 운영센터
    </div>

  </div>


  <!-- ============================================== -->
  <!-- MODAL: 거래처 회원가입 신청 (관리자 승인제)     -->
  <!-- ============================================== -->
  <div id="register-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
      
      <!-- Header -->
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <div class="flex items-center space-x-2">
          <div class="w-7 h-7 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold">
            <i data-lucide="building-2" class="w-4 h-4"></i>
          </div>
          <h3 class="font-bold text-slate-900 text-sm">거래처 회원가입 신청</h3>
        </div>
        <button onclick="closeRegisterModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Form -->
      <form onsubmit="handleRegister(event)" class="p-5 space-y-3.5 text-xs">
        
        <div class="bg-blue-50 border border-blue-200 p-3 rounded-xl text-blue-900 leading-relaxed">
          <div class="font-bold text-[11px] mb-0.5">📌 가입 안내:</div>
          거래처 정보를 입력하여 가입을 신청하시면, <strong>금강공업 관리자가 확인 후 승인</strong>하면 계정이 최종 활성화됩니다.
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">거래처명 (회사명) *</label>
          <input type="text" id="reg-company" required placeholder="예: 대림철강(주)" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-600 bg-white">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">희망 가입 아이디 (또는 거래처코드) *</label>
          <input type="text" id="reg-login-id" required placeholder="예: DL-9012 또는 영문/숫자 아이디" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-600 bg-white">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">비밀번호 *</label>
            <input type="password" id="reg-pw" required placeholder="비밀번호 입력" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-600 bg-white">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">비밀번호 확인 *</label>
            <input type="password" id="reg-pw-confirm" required placeholder="비밀번호 재입력" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-600 bg-white">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">담당자 이름 *</label>
            <input type="text" id="reg-name" required placeholder="예: 이영호" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-600 bg-white">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">담당자 연락처 *</label>
            <input type="tel" id="reg-contact" required placeholder="예: 010-1234-5678" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-600 bg-white">
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">이메일</label>
          <input type="email" id="reg-email" placeholder="성적서 수신용 이메일" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-600 bg-white">
        </div>

        <div id="reg-error" class="hidden p-2.5 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs"></div>

        <div class="pt-2 flex justify-end space-x-2">
          <button type="button" onclick="closeRegisterModal()" class="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg hover:bg-slate-50 font-medium">
            취소
          </button>
          <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow transition">
            가입 신청 제출
          </button>
        </div>

      </form>
    </div>
  </div>

  <script>
    let currentLoginType = 'client';

    function switchLoginType(type) {
      currentLoginType = type;
      const tabClient = document.getElementById('tab-client');
      const tabAdmin = document.getElementById('tab-admin');
      const label = document.getElementById('login-id-label');
      const input = document.getElementById('login-id');

      if (type === 'client') {
        tabClient.className = 'py-2.5 rounded-lg bg-white text-blue-700 shadow-sm transition';
        tabAdmin.className = 'py-2.5 rounded-lg text-slate-500 hover:text-slate-800 transition';
        label.innerText = '거래처 코드 (또는 아이디)';
        input.placeholder = '예: KC-10294';
      } else {
        tabAdmin.className = 'py-2.5 rounded-lg bg-white text-blue-700 shadow-sm transition';
        tabClient.className = 'py-2.5 rounded-lg text-slate-500 hover:text-slate-800 transition';
        label.innerText = '사번 또는 관리자 아이디';
        input.placeholder = '예: admin 또는 이메일';
      }
      if (window.lucide) lucide.createIcons();
    }

    function quickFill(id, pw, type) {
      switchLoginType(type);
      document.getElementById('login-id').value = id;
      document.getElementById('login-pw').value = pw;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const loginId = document.getElementById('login-id').value.trim();
      const password = document.getElementById('login-pw').value;
      const errBox = document.getElementById('login-error');
      errBox.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ loginId, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('auth_token', data.token);
          localStorage.setItem('auth_user', JSON.stringify(data.user));
          window.location.href = '/index.html';
        } else {
          errBox.innerText = data.error || '로그인에 실패했습니다.';
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        errBox.innerText = '서버 연결 실패: ' + err.message;
        errBox.classList.remove('hidden');
      }
    }

    function openRegisterModal() {
      document.getElementById('register-modal').classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }
    function closeRegisterModal() {
      document.getElementById('register-modal').classList.add('hidden');
    }

    async function handleRegister(e) {
      e.preventDefault();
      const errBox = document.getElementById('reg-error');
      errBox.classList.add('hidden');

      const companyName = document.getElementById('reg-company').value.trim();
      const loginId = document.getElementById('reg-login-id').value.trim();
      const pw = document.getElementById('reg-pw').value;
      const pwConfirm = document.getElementById('reg-pw-confirm').value;
      const managerName = document.getElementById('reg-name').value.trim();
      const contact = document.getElementById('reg-contact').value.trim();
      const email = document.getElementById('reg-email').value.trim();

      if (pw !== pwConfirm) {
        errBox.innerText = '비밀번호와 비밀번호 확인이 일치하지 않습니다.';
        errBox.classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            loginId,
            password: pw,
            companyName,
            managerName,
            contact,
            email
          })
        });

        const data = await res.json();
        if (data.success) {
          alert('🎉 회원가입 신청이 완료되었습니다!\n\n관리자가 확인 후 승인하면 바로 로그인하여 이용하실 수 있습니다.');
          closeRegisterModal();
          switchLoginType('client');
          document.getElementById('login-id').value = loginId;
          document.getElementById('login-pw').value = pw;
        } else {
          errBox.innerText = data.error || '회원가입 신청 실패';
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        errBox.innerText = '서버 통신 실패: ' + err.message;
        errBox.classList.remove('hidden');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
